name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit and API tests
        run: npm test
      - name: Browser test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricecompare-screenshots
          path: test-results/e2e

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to update the "app-latest" pre-release
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3

      # Until a release key is set up (README), builds use a debug key. Keeping
      # it in the cache keeps the signature the same between builds, so each
      # new APK installs over the previous one.
      - name: Reuse the debug signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Use the release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the web app and copy it into the Android project
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/price-compare.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: price-compare-apk
          path: ${{ runner.temp }}/price-compare.apk

      # One stable link to tap on a phone: the newest APK from main.
      - name: Publish the "app-latest" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git tag -f app-latest "$GITHUB_SHA"
          git push -f origin refs/tags/app-latest
          notes="Latest Price Compare build from \`main\` ($GITHUB_SHA). On your Android phone, download price-compare.apk and open it to install."
          if gh release view app-latest > /dev/null 2>&1; then
            gh release edit app-latest --prerelease --notes "$notes"
          else
            gh release create app-latest --prerelease --title "Price Compare for Android (latest build)" --notes "$notes"
          fi
          gh release upload app-latest "$RUNNER_TEMP/price-compare.apk" --clobber
